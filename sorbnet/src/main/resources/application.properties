
# Konfiguracja Aplikacji i Serwera
spring.application.name=sorbnet
server.port=8080

# Ustawienia wyświetlania błędów (przydatne dewelopersko, na produkcję zaleca się 'never')
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always


# Konfiguracja Bazy Danych (YugabyteDB / PostgreSQL)
# Pozwala na wstrzyknięcie wartości przez zmienne środowiskowe, z fallbackiem na localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5460/sorbnet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yugabyte}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yugabyte}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ustawienia puli połączeń HikariCP (czasy w milisekundach)
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000


# Konfiguracja JPA i Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' automatycznie aktualizuje schemat bazy, na produkcji bezpieczniej używać 'validate' lub Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Wymuszona inicjalizacja skryptów SQL po starcie Hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Konfiguracja Apache Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# --- Producent ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
# Włączenie idempotencji zapobiega duplikatom wiadomości przy powtórzeniach (retries)
spring.kafka.producer.enable-idempotence=true

# --- Konsument ---
spring.kafka.consumer.group-id=sorbnet-group
# 'earliest' czyta od początku w przypadku braku zapisanego offsetu
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.isolation-level=read_uncommitted
spring.kafka.consumer.max-poll-records=500


# Konfiguracja Logowania

logging.level.pl.pz.sorbnet=DEBUG
logging.level.org.springframework.web=DEBUG

# Ustawienia Domenowe Aplikacji (Sorbnet)

sorbnet.overlimit.block-after-minutes=1
sorbnet.overlimit.block-after-hours=2
sorbnet.gridlock.interval-ms=30000