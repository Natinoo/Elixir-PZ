version: '3.9'
services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10

  elixir_system:
    build: ./elixir
    container_name: elixir_system
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  elixir_express_system:
    build: ./elixir-express
    container_name: elixir_express_system
    ports:
      - "8082:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  sorbnet_system:
    build: ./sorbnet       
    container_name: sorbnet_system
    ports:
      - "8083:8080"
    depends_on:
      kafka:
        condition: service_healthy
      yugabyte:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:yugabytedb://yugabyte:5433/sorbnet
      SPRING_DATASOURCE_USERNAME: yugabyte
      SPRING_DATASOURCE_PASSWORD: yugabyte

  yugabyte:
  image: yugabytedb/yugabyte:2024.2.9.0-b55
  container_name: yugabyte
  ports:
    - "5460:5433"
    - "7000:7000"
    - "9000:9000"
  command: |
    bash -c '
    mkdir -p /var/ybinit
    echo "CREATE DATABASE sorbnet;" > /var/ybinit/01-db.sql
    bin/yugabyted start --daemon=false --initial_scripts_dir=/var/ybinit
    '
  healthcheck:
    test: ["CMD-SHELL", "bin/ysqlsh -c 'SELECT 1'"]
    interval: 15s
    timeout: 10s
    retries: 10
  volumes:
    - yugabyte_data:/home/yugabyte/var

volumes:
  yugabyte_data: