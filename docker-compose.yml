services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - ./kafka_data:/tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.elixir --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.elixir-express --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.sorbnet --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.express.sorbnet --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic responses.elixir --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic responses.elixir-express --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.sorbnet.settlement --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notifications.banks --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events.gridlock --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events.emergency --partitions 1 --replication-factor 1
      "
    restart: "no"

  yugabyte:
    image: yugabytedb/yugabyte:2024.2.9.0-b55
    container_name: yugabyte
    ports:
      - "5460:5433"
      - "7000:7000"
      - "9000:9000"
    command: |
      bash -c '
          mkdir -p /var/ybinit
          echo "CREATE DATABASE sorbnet;" > /var/ybinit/01-db.sql
          echo "CREATE DATABASE elixir;" > /var/ybinit/02-db.sql
          bin/yugabyted start --daemon=false --initial_scripts_dir=/var/ybinit
          '
    healthcheck:
      test: ["CMD-SHELL", "bin/ysqlsh -h $(hostname -i) -U yugabyte -d yugabyte -tAc 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - yugabyte_data:/home/yugabyte/var

  elixir_system:
    build: ./elixir
    container_name: elixir_system
    ports:
      - "8081:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      yugabyte:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://yugabyte:5433/elixir
      SPRING_DATASOURCE_USERNAME: yugabyte
      SPRING_DATASOURCE_PASSWORD: yugabyte

  elixir_express_system:
    build: ./elixir-express
    container_name: elixir_express_system
    ports:
      - "8082:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  sorbnet_system:
    build: ./sorbnet
    container_name: sorbnet_system
    ports:
      - "8083:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      yugabyte:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://yugabyte:5433/sorbnet
      SPRING_DATASOURCE_USERNAME: yugabyte
      SPRING_DATASOURCE_PASSWORD: yugabyte

  sorbnet_banks_gui:
    build: ./sorbnet-bank-ui
    container_name: sorbnet_banks_gui
    ports:
      - "5173:5173"
    volumes:
      - ./sorbnet-bank-ui:/app
      - sorbnet_banks_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  sorbnet_operator_gui:
    build: ./sorbnet-operator-ui
    container_name: sorbnet_operator_gui
    ports:
      - "5174:5174"
    volumes:
      - ./sorbnet-operator-ui:/app
      - sorbnet_operator_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174

volumes:
  yugabyte_data:
  sorbnet_banks_node_modules:
  sorbnet_operator_node_modules: